org.gradle.jvmargs=-Xmx4608M
android.useAndroidX=true
# Jetifier rewrites legacy Support Library references to AndroidX for dependencies that
# haven't migrated — every dependency here (Flutter engine, path_provider, just_audio,
# provider, simple_ripple_animation) already ships AndroidX-native, so it has nothing to
# do but still runs its transform over every jar. Disabling it removes real build time
# and heap pressure (this is what ran out of memory on the previous release build).
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
