name: ludo_flutter
description: Ludo game with flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  firebase_auth: ^6.5.7
  firebase_core: ^4.13.0
  firebase_database: ^12.4.7
  flutter:
    sdk: flutter
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  mobile_scanner: ^7.4.0
  provider: ^6.1.2
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  simple_ripple_animation: ^0.0.9

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/dice/
    - assets/images/crown/
    - assets/sounds/

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#04292A"
    theme_color: "#0E7C7B"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
